; PlatformIO build for the SAME sketch used by the Arduino IDE (src_dir = .).
;   pio run              build
;   pio run -t upload    flash
;   pio device monitor   serial monitor (115200)
; espressif32@6.9.0 ships Arduino-ESP32 core 2.0.17. The same sketch also builds on
; core 3.x (verified with 3.3.13 via arduino-cli / Arduino IDE, board "ESP32 Dev Module").

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
